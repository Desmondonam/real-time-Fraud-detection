# One command for the whole stack:
#
#   docker compose up -d --build
#
# Postgres → bootstrap (ingest CSV + train model, skipped when already done)
#          → Kafka producer (replays the CSV) → consumer (scores each event)
#          → Airflow (http://localhost:8080) and Grafana (http://localhost:3001)
#
# Credentials come from .env (see .env.example); the defaults below are for local use only.

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: transactions

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-fraud_detection}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-fraud_detection}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: load the CSV and train the model. Both steps are skipped when
  # their output already exists, so restarts are fast.
  bootstrap:
    build: .
    container_name: fraud_bootstrap
    command: >
      sh -c "python src/ingest_and_clean.py --if-empty &&
             python src/train_detector.py --if-missing"
    environment:
      <<: *db-env
      MODEL_PATH: /app/models/fraud_scorer.pkl
    volumes:
      - ./data:/app/data:ro
      - models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    container_name: fraud_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"   # for running the producer/consumer from the host
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Replays creditcard.csv into the `transactions` topic in Time order.
  # REPLAY_SPEEDUP=60 → the 48-hour dataset plays out in ~48 minutes.
  producer:
    build: .
    container_name: fraud_producer
    command: python -m src.streaming.producer
    environment:
      <<: *kafka-env
      REPLAY_CSV: /app/data/creditcard.csv
      REPLAY_SPEEDUP: ${REPLAY_SPEEDUP:-60}
      REPLAY_START_TIME: ${REPLAY_START_TIME:-0}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started

  # Scores every event and writes it to scored_transactions.
  consumer:
    build: .
    container_name: fraud_consumer
    command: python -m src.streaming.consumer
    environment:
      <<: [*kafka-env, *db-env]
      MODEL_PATH: /app/models/fraud_scorer.pkl
    volumes:
      - models:/app/models:ro
    depends_on:
      kafka:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow:
    build: ./docker/airflow
    container_name: fraud_airflow
    command: standalone
    environment:
      <<: *db-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/airflow_metadata
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      MODEL_PATH: /opt/models/fraud_scorer.pkl
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # The DAG resolves its project root two levels up from /opt/airflow/dags = /opt
      - ./src:/opt/src
      - ./scripts:/opt/scripts
      - models:/opt/models
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: fraud_grafana
    environment:
      DB_NAME: ${DB_NAME:-fraud_detection}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fraud_detection.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  models:
  grafana_data:
