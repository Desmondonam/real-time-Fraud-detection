name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker:
    name: docker build + DAG import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build bootstrap airflow

      - name: Import the Airflow DAG inside the Airflow image
        run: |
          docker compose run --rm --no-deps --entrypoint python \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            airflow -c "
          from airflow.models import DagBag
          bag = DagBag('/opt/airflow/dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert 'fraud_model_retraining' in bag.dags, bag.dags
          print('DAGs:', list(bag.dags))
          "
