apiVersion: 1

# Credentials are injected from the container environment (see docker-compose.yml),
# so this file can be committed as-is.
datasources:
  - name: FraudDB
    type: postgres
    uid: fraud_postgres
    url: postgres:5432
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
